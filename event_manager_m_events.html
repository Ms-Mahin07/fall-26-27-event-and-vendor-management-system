<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EventFlow Event Manager">
  <title>Manage Events | EventFlow</title>
  <link rel="stylesheet" href="css/em_style.css">
</head>
<body>
  <header class="header">
    <a href="event_manager_dashboard.html" class="logo">Event<span>Flow</span></a>
    <div class="user-info">
      <span class="badge manager">Event Manager</span>
      <span id="welcomeUser">Welcome, Event Manager</span>
      <a href="index.html" class="btn btn-small btn-light">Logout</a>
    </div>
  </header>

  <nav class="topnav">
    <a href="event_manager_dashboard.html">Dashboard</a>
    <a href="event_manager_m_events.html" class="active">Manage Events</a>
    <a href="event_manager_m_venues.html">Manage Venues</a>
    <a href="event_manager_v_bookings.html">Vendor Bookings</a>
  </nav>

  <main class="container">
    <section id="eventSection" class="page-section">
      <h2 class="page-title">Manage Events</h2>
      <p class="page-subtitle">Create or modify event.</p>

      <div id="eventMessage" class="message"></div>

      <div class="row">
        <div class="col">
          <div class="card">
            <h3 id="eventFormTitle">Create New Event</h3>
            <form id="eventForm" onsubmit="return saveEvent()">
              <input type="hidden" id="eventId">
              <fieldset>
                <legend>Event Details</legend>
                <table class="form-table">
                  <tr><td><label for="eventName">Name:</label></td><td><input type="text" id="eventName" placeholder="Event name"><span class="error" id="eventNameError"></span></td></tr>
                  <tr><td><label for="eventType">Type:</label></td><td><select id="eventType"><option value="">-- Select Type --</option><option value="Wedding">Wedding</option><option value="Corporate">Corporate</option><option value="Birthday">Birthday</option><option value="Conference">Conference</option><option value="Other">Other</option></select><span class="error" id="eventTypeError"></span></td></tr>
                  <tr><td><label for="eventDate">Date:</label></td><td><input type="date" id="eventDate"><span class="error" id="eventDateError"></span></td></tr>
                  <tr><td><label for="eventStart">Start time:</label></td><td><input type="time" id="eventStart"><span class="error" id="eventStartError"></span></td></tr>
                  <tr><td><label for="eventEnd">End time:</label></td><td><input type="time" id="eventEnd"><span class="error" id="eventEndError"></span></td></tr>
                  <tr><td><label for="eventVenue">Venue:</label></td><td><input type="text" id="eventVenue" placeholder="e.g. Grand Hall"><span class="error" id="eventVenueError"></span></td></tr>
                  <tr><td><label for="eventClient">Client:</label></td><td><input type="text" id="eventClient" placeholder="Client name"><span class="error" id="eventClientError"></span></td></tr>
                  <tr><td><label for="eventBudget">Budget (Tk):</label></td><td><input type="number" id="eventBudget" min="0" placeholder="e.g. 50000"><span class="error" id="eventBudgetError"></span></td></tr>
                  <tr><td><label for="eventStatus">Status:</label></td><td><select id="eventStatus"><option value="Upcoming">Upcoming</option><option value="Completed">Completed</option><option value="Cancelled">Cancelled</option></select></td></tr>
                </table>
              </fieldset>
              <input type="submit" id="eventSaveButton" class="btn" value="Add Event">
              <button type="button" class="btn btn-secondary" onclick="resetEventForm()">Cancel</button>
            </form>
          </div>
        </div>

        <div class="col-wide">
          <div class="card">
            <h3>Event List</h3>
            <div class="search-bar">
              <input type="text" id="eventSearch" placeholder="Search by name, venue, client or id..." onkeyup="renderEvents()">
              <select id="eventTypeFilter" onchange="renderEvents()"><option value="All">All types</option><option value="Wedding">Wedding</option><option value="Corporate">Corporate</option><option value="Birthday">Birthday</option><option value="Conference">Conference</option><option value="Other">Other</option></select>
              <select id="eventStatusFilter" onchange="renderEvents()"><option value="All">Any status</option><option value="Upcoming">Upcoming</option><option value="Completed">Completed</option><option value="Cancelled">Cancelled</option></select>
            </div>
            <p class="result-count" id="eventCount"></p>
            <div class="table-wrapper">
              <table class="data-table">
                <thead><tr><th>ID</th><th>Event</th><th>Date / Time</th><th>Venue</th><th>Budget</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="eventTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    &copy; 2026 EventFlow &middot; Event Management System
  </footer>

  <!-- Keep your existing JavaScript file here. It should define the page functions
       used by the inline handlers, such as showSection(), saveEvent(), renderEvents(),
       saveVenue(), renderVenues(), saveVendorBooking(), and renderVendorBookings(). -->
  <script src="js/script.js"></script>
</body>
</html>
